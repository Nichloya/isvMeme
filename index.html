<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>
      Interslavic Meme generator
    </title>
  </head>
  <body>
    <div id="kuntayner">
    <header>
    <img src="horugva.svg">
          <h3>
        Stvoritelnik směšnyh obrazkov
        <br>
        Створителник смєшных образков
      </h3>
    </header>
<main>
      <div id="divCanvas">
        <canvas id="memeCanvas" width="500" height="500">
        </canvas>
      </div>
      <div id="topControl">
        <div class="knopky">
          <label class="buttonka" for='imageLoader' id="upload">
            <span>
            Dodati obrazok
            </span>
            <input type='file' id="imageLoader" style="display:none;" accept="image/*">
            <div class="gap">
            </div>
            <span><nobr>Додати образок</nobr></span>
          </label>
          <label for="downButton" class="buttonka" id="download">
            <span>
            Dobyti mem
            </span>
            <button id=downButton onclick="downloadMeme()" style="display:none"></button>
            <div class="gap">
            </div>
            <span>
            Добыти мем
            </span>
          </label>
        </div>
        <div class="punkt">
          <span>
          Razměr teksta
          </span>
          <input type="range" min="50" max="150" value="100" class="slider" id="myRange" list="markers">
          <datalist id="markers">
            <option value="75"></option>
            <option value="75"></option>
            <option value="100"></option>
            <option value="125"></option>
          </datalist>
          <div class="hor">
            <img src="fontsize.svg" width="16">
            <span id="demo">
            </span>
          </div>
          <span>
          Размєр текста
          </span>
        </div>
      </div>
      <textarea id='inputText'>
        ну привет
      </textarea>
      <div id="keyboard">
      <script src="script.js"></script>
      <script src="insertAtCaret.js"></script>
      <script src="keyboard.js"></script>
    </main>
    </div>
  </body>
</html>
</html>
